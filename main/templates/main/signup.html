{% extends 'main/base.html' %} {% load static %} {% block head %}
<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
<link rel="stylesheet" href="{% static 'css/signin.css' %}" type="text/css" />
{% endblock %} {% block content %}

<section class="ftco-section">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-md-12 col-lg-10">
        <div class="wrap d-md-flex">
          <div class="img" style="background-image: url(https://images.unsplash.com/photo-1615529182904-14819c35db37?q=80&w=2960&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D)"></div>
          <div class="login-wrap p-4 p-md-5">
            <div class="d-flex">
              <div class="w-100">
                <h3 class="mb-4">Sign Up</h3>
              </div>
              <!-- <div class="w-100">
                <p class="social-media d-flex justify-content-end">
                  <a href="#" class="social-icon d-flex align-items-center justify-content-center"><span class="fa fa-facebook"></span></a>
                  <a href="#" class="social-icon d-flex align-items-center justify-content-center"><span class="fa fa-twitter"></span></a>
                </p>
              </div> -->
            </div>
            <form action="#" class="signin-form" action="/signup" method="post">
              {% csrf_token %}
              <div class="form-group mb-3">
                {% if messages %} {% for message in messages %}
                <div class="alert">{{message}}</div>
                {% endfor %} {% endif %}
                <p>{{msg}}</p>
              </div>
              <div class="form-group mb-3">
                <label class="label" for="first_name">First Name</label>
                <input type="text" class="form-control" placeholder="First Name" required name="first_name" />
              </div>
              <div class="form-group mb-3">
                <label class="label" for="last_name">Last Name</label>
                <input type="text" class="form-control" placeholder="Last Name" required name="last_name" />
              </div>
              <div class="form-group mb-3">
                <label class="label" for="name">Email or Phone Number</label>
                <input type="text" class="form-control" placeholder="Username" required name="username" />
              </div>
              <div class="form-group mb-3">
                <label class="label" for="password">Password</label>
                <input type="password" class="form-control" placeholder="Password" required name="password" />
              </div>
              <div class="form-group">
                <button type="submit" style="background-color: #dc3545; color: white" class="form-control btn btn-primary rounded submit px-3">Sign Up</button>
              </div>
              <div class="form-group d-md-flex">
                <!-- <div class="w-50 text-left">
                  <label class="checkbox-wrap checkbox-primary mb-0"
                    >Remember Me
                    <input type="checkbox" checked />
                    <span class="checkmark"></span>
                  </label>
                </div> -->
                <div class="w-50 text-left">
                  <a href="{% url 'forgot_password' %}">Forgot Password</a>
                </div>
              </div>
            </form>
            <p class="text-center">
              <a href="{% url 'login' %}">Sign In</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
