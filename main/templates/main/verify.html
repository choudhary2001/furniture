{% extends 'main/base.html' %} {% load static %} {% block head %}
<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
<link rel="stylesheet" href="{% static 'css/signin.css' %}" type="text/css" />
{% endblock %} {% block content %}

<section class="ftco-section">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-md-12 col-lg-10">
        <div class="wrap d-md-flex">
          <div class="img" style="background-image: url(https://images.unsplash.com/photo-1615529182904-14819c35db37?q=80&w=2960&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D)"></div>
          <div class="login-wrap p-4 p-md-5">
            <div class="d-flex justify-content-center">
              <div class="w-100">
                <h3 class="mb-4">Verify Your Account</h3>
              </div>
            </div>
            <div class="w-100">
              <h5 class="mb-4">{{number}}</h5>
            </div>
            <form action="{% url 'verify' %}" class="signin-form" method="post">
              {% csrf_token %}

              <div class="form-group mb-3">
                {% if messages %} {% for message in messages %}
                <div class="alert">{{message}}</div>
                {% endfor %} {% endif %}
              </div>
              <div class="form-group mb-3">
                <label class="label" for="name">Otp</label>
                <input type="number" class="form-control" placeholder="Otp" required name="otp" />
              </div>

              <div class="form-group">
                <button type="submit" class="form-control btn btn-primary rounded submit px-3">Verify</button>
              </div>
              <div class="form-group">
                <div class="w-50 text-md-right">
                  <a href="/verify?username={{number}}">Resend</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
